# Continuous integration: runs on every pull request and every push to main.
#
# Woodpecker reads every `*.yml` in this folder as its own workflow. Deploys are not wired up: see
# `deploy.yml.example` and docs/woodpecker-ci-setup.md.
#
# Deno 2.9.0 is the version the repository uses (`DENO_VERSION` in infra/envs/.env.example and
# Dockerfile.base). Playwright 1.57.0 is the version `deno task e2e` runs (deno.jsonc); the e2e
# image tag must match it, because the browser build inside the image is tied to that version.

when:
  - event: pull_request
  - event: push
    branch: main

steps:
  check:
    image: denoland/deno:2.9.0
    commands:
      - deno task check

  build:
    image: denoland/deno:2.9.0
    commands:
      - deno task build
    depends_on: [check]

  integration:
    image: denoland/deno:2.9.0
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      # Wait over TCP. Postgres first runs a temporary server that listens on a unix socket only,
      # so a successful TCP connection means the real server is up (docs/handoff.md, trap 3).
      # Valkey has no such phase.
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i === 120) {
                  console.error(`${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      - deno task test:integration
    depends_on: [check]

  e2e:
    # The image carries Chromium and its system libraries. Installing the browser through Deno
    # (`playwright install`) downloads it and then hangs (issue 48), so nothing is installed here.
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    commands:
      - npm install --global deno@2.9.0
      - deno --version
      # The other two e2e tests need the full Docker stack; this one serves its own fixture.
      - deno task e2e url-filters
    depends_on: [check]

  e2e-mpa:
    # The MPA's browser tests: with JavaScript turned off, a visitor subscribes to the newsletter,
    # confirms and unsubscribes through the mailed links. e2e/mpa/run.sh migrates, starts the API,
    # the worker and the MPA behind one origin and runs them. It creates its own database
    # (`template_e2e`), so it shares nothing with the integration step, which uses `template_test`
    # at the same time. `DB_NAME` below is only the database the script connects to first.
    image: mcr.microsoft.com/playwright:v1.57.0-noble
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: tester
      DB_PASS: ci-throwaway
      DB_NAME: template_test
      KV_HOSTNAME: valkey
      KV_PORT: "6379"
      KV_PASSWORD: ci-throwaway
    commands:
      - npm install --global deno@2.9.0
      - deno --version
      # Postgres first runs a temporary server that listens on a unix socket only, so a TCP
      # connection means the real one is up (docs/handoff.md, trap 3). Valkey has no such phase.
      - |
          deno eval '
          for (const [hostname, port] of [["postgres", 5432], ["valkey", 6379]]) {
            for (let i = 0; ; i++) {
              try {
                (await Deno.connect({ hostname, port })).close()
                break
              } catch {
                if (i >= 120) {
                  console.error(`$${hostname} did not accept connections within 60 s`)
                  Deno.exit(1)
                }
                await new Promise((resolve) => setTimeout(resolve, 500))
              }
            }
          }
          '
      - e2e/mpa/run.sh
    depends_on: [check]

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: tester
      POSTGRES_PASSWORD: ci-throwaway
      POSTGRES_DB: template_test
  valkey:
    image: valkey/valkey:8.1
    commands:
      - valkey-server --requirepass ci-throwaway
