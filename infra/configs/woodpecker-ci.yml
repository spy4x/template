# Woodpecker CI Pipeline Configuration
# This pipeline runs quality checks, builds Docker images, and deploys to production

# Pipeline steps
steps:
  # ============================================================================
  # Step 1: Code Quality Checks
  # ============================================================================
  check:
    image: denoland/deno:alpine-2.9.0@sha256:171790989a9d2397de0811c208da32597cff2624a5b3e675a5943cd6a01d4935
    when:
      event:
        - push
        - pull_request
    environment:
      DENO_DIR: /deno-dir
    volumes:
      - deno-cache:/deno-dir
    commands:
      - echo "Running code quality checks with Deno cache..."
      - apk add --no-cache age=1.3.1-r5 git=2.54.0-r0
      - wget --quiet https://github.com/getsops/sops/releases/download/v3.11.0/sops-v3.11.0.linux.amd64 --output-document /tmp/sops
      - echo "775f1384d55decfad228e7196a3f683791914f92a473f78fc47700531c29dfef  /tmp/sops" | sha256sum -c -
      - chmod 0755 /tmp/sops
      - mv /tmp/sops /usr/local/bin/sops
      - deno --version | grep "deno 2.9.0"
      - sops --version | grep "sops 3.11.0"
      - age --version | grep "1.3.1"
      - deno task check

  build:
    image: denoland/deno:alpine-2.9.0@sha256:171790989a9d2397de0811c208da32597cff2624a5b3e675a5943cd6a01d4935
    when:
      event:
        - push
        - pull_request
    environment:
      DENO_DIR: /deno-dir
    volumes:
      - deno-cache:/deno-dir
    commands:
      - echo "Building the project with Deno cache..."
      - deno task build
    depends_on:
      - check

  # ============================================================================
  # Step 2: Build Docker Images (Production)
  # ============================================================================
  pre-deploy-build:
    image: denoland/deno:alpine-2.9.0@sha256:171790989a9d2397de0811c208da32597cff2624a5b3e675a5943cd6a01d4935
    environment:
      ENV: prod
      DENO_VERSION:
        from_secret: deno_version
      DB_HOST:
        from_secret: db_host
      DB_PORT:
        from_secret: db_port
      DB_NAME:
        from_secret: db_name
      DB_USER:
        from_secret: db_user
      DB_PASSWORD:
        from_secret: db_password
      KV_HOSTNAME:
        from_secret: kv_hostname
      KV_PORT:
        from_secret: kv_port
      API_PORT:
        from_secret: api_port
      SPA_PORT:
        from_secret: spa_port
      DOMAIN:
        from_secret: domain
      TRAEFIK_ACME_EMAIL:
        from_secret: traefik_acme_email
      SSH_TO_SERVER:
        from_secret: ssh_to_server
      PATH_ON_SERVER:
        from_secret: path_on_server
    commands:
      - echo "Creating production environment file..."
      # Create the .env.prod file from environment variables
      - |
        cat > ./infra/envs/.env.prod << EOF
        ENV=prod
        DENO_VERSION=${DENO_VERSION}
        DB_HOST=${DB_HOST}
        DB_PORT=${DB_PORT}
        DB_NAME=${DB_NAME}
        DB_USER=${DB_USER}
        DB_PASSWORD=${DB_PASSWORD}
        KV_HOSTNAME=${KV_HOSTNAME}
        KV_PORT=${KV_PORT}
        API_PORT=${API_PORT}
        SPA_PORT=${SPA_PORT}
        DOMAIN=${DOMAIN}
        TRAEFIK_ACME_EMAIL=${TRAEFIK_ACME_EMAIL}
        SSH_TO_SERVER=${SSH_TO_SERVER}
        PATH_ON_SERVER=${PATH_ON_SERVER}
        EOF
      - echo "Building Docker images..."
      - deno task compose --env-file=./infra/envs/.env.prod build
    when:
      event: push
      branch: main
    depends_on:
      - build

  # ============================================================================
  # Step 3: Deploy to Production
  # Note: SSH_TO_SERVER and PATH_ON_SERVER are read from .env.prod written by
  # pre-deploy-build (the single source of truth), not injected here.
  # ============================================================================
  deploy:
    image: denoland/deno:debian-2.9.0@sha256:8d24854de78a79c56e74b49aa4c5996c60e1fe3730efba8fbdd2692c582e6e29
    environment:
      SSH_PRIVATE_KEY:
        from_secret: ssh_private_key
    commands:
      - echo "Setting up SSH..."
      # Install rsync and ssh client
      - apt-get update && apt-get install -y rsync openssh-client
      # Setup SSH key
      - mkdir -p ~/.ssh
      - echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
      - chmod 600 ~/.ssh/id_rsa
      # Add server to known hosts (adjust hostname as needed)
      - ssh-keyscan -H $(echo $SSH_TO_SERVER | cut -d'@' -f2) >> ~/.ssh/known_hosts
      - echo "Deploying to production..."
      - deno task deploy
    when:
      event: push
      branch: main
    depends_on:
      - pre-deploy-build

