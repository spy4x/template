networks:
  proxy:
    external: true

services:

  db:
    healthcheck:
      interval: 1m30s
      timeout: 30s
      retries: 5
      start_period: 40s
  
  minio:
    networks:
      - proxy
      - default
    labels:
      - "traefik.docker.network=proxy"
      - 'traefik.http.routers.minio.entrypoints=websecure'
      - 'traefik.http.routers.minio.tls=true'
      - 'traefik.http.routers.minio.tls.certresolver=myresolver'

  grafana:
    networks:
      - proxy
      - default
    labels:
      - "traefik.docker.network=proxy"
      - 'traefik.http.routers.grafana.entrypoints=websecure'
      - 'traefik.http.routers.grafana.tls=true'
      - 'traefik.http.routers.grafana.tls.certresolver=myresolver'

  api:
    networks:
      - proxy
      - default
    environment:
      - ENV=prod
    labels:
      # These override compose.shared.yml's api-${PROJECT} router by name, so this stays one
      # router (rule from compose.shared.yml, transport from here) instead of a second router
      # that never matches. Overriding `entrypoints` from `web` to `websecure` drops the plain
      # HTTP listener for this router, same as the pre-existing minio/grafana routers below.
      - "traefik.docker.network=proxy"
      - 'traefik.http.routers.api-${PROJECT}.entrypoints=websecure'
      - 'traefik.http.routers.api-${PROJECT}.tls=true'
      - 'traefik.http.routers.api-${PROJECT}.tls.certresolver=myresolver'
      # Keep the CF-Connecting-IP strip from compose.shared.yml's api-${PROJECT} router; see the
      # comment there for why it is required.
      - 'traefik.http.routers.api-${PROJECT}.middlewares=strip-cf-ip-${PROJECT}'

  spa:
    networks:
      - proxy
      - default
    build:
      dockerfile: apps/spa/dockerfile.prod
    labels:
      # Overrides compose.shared.yml's spa-${PROJECT} router by name; see the api router above.
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.spa-${PROJECT}.entrypoints=websecure"
      - "traefik.http.routers.spa-${PROJECT}.tls=true"
      - "traefik.http.routers.spa-${PROJECT}.tls.certresolver=myresolver"
