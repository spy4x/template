services:
  db:
    healthcheck:
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    user: "0:0"  # Run as root in dev mode for Podman compatibility
    environment:
      - ENV=dev
    security_opt:
      - label=disable
    healthcheck:
      interval: 3s
    networks:
      - default
      - proxy

  web:
    user: "0:0"  # Run as root in dev mode for Podman compatibility
    environment:
      - VITE_ENV=dev
    build:
      dockerfile: apps/web/dockerfile.dev
      args:
        - DENO_VERSION=${DENO_VERSION}
    security_opt:
      - label=disable
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.web-${PROJECT}.rule=Host(`${DOMAIN}`) && !PathPrefix(`/api`) && !PathPrefix(`/ws`)"
      - "traefik.http.routers.web-${PROJECT}.entrypoints=web"
      - "traefik.http.routers.web-${PROJECT}.service=web-${PROJECT}"
      - "traefik.http.services.web-${PROJECT}.loadbalancer.server.port=5173"
      - "traefik.docker.network=proxy"
    networks:
      - default
      - proxy
    healthcheck:
      test: ["CMD", "wget", "--spider", "http://127.0.0.1:5173"]
      interval: 3s

networks:
  proxy:
    external: true
