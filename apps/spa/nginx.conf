# The access log records the path only, never the query or the Referer: a password reset link
# carries its code in the query (/reset-password?email=...&code=...), and container logs are shipped.
log_format path_only '$remote_addr [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 8080;
    server_name localhost;
    access_log /var/log/nginx/access.log path_only;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # The reset page holds its code in the address: its requests send no Referer.
    location = /reset-password {
        add_header Referrer-Policy "no-referrer" always;
        try_files /index.html =404;
    }

    # Optional: gzip static files
    gzip on; 
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 256;
}
